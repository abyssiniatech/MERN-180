<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in html</title>
    <link rel="stylesheet" href="form.css">
        <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- form info -->
     <div class="m-4 p-4 border-2 rounded bg-white shadow-lg max-w-[800px] m-auto bg-gray-100 mt-10">
         <form class="rounded border-opacity-10 bg-gradient  text-black border-gray-300 space-y-6 shadow-md-lg-xl p-6">
             <h1 class="text-4xl font-bold mb-4 text-center ">Form in HTML</h1>
            <label for="name" class="text-3xl ">Name:</label>
            <input class="w-full p-4 rounded " type="text" id="name" name="name" placeholder="Enter your name" required>

            <label class="text-3xl " for="email">Email:</label></label>
            <input class="w-full p-4 rounded border-0 " type="email" id="email" name="email" placeholder="Enter your email" required>
            <label class="text-3xl " for="password">Password:</label></label>
            <input  class="w-full p-4 rounded  mb-2" type="password" id="password" name="password" placeholder="At least 8 characters" required>
            <!--  -->
            <fieldset>
                <legend class="text-3xl border-b-2 border-gray-300 pb-2 mb-4">Do you Agree the terms?</legend>
                <input class="text-5xl " type="radio" id="agree" name="terms" value="agree" >
                <label for="agree">Agree</label>
                <input type="radio" id="disagree" name="terms" value="disagree">
                <label for="disagree">Disagree</label>

            </fieldset>
            <input class="bg-blue-600 text-3xl hover:bg-blue-700 w-full  px-4 py-2 text-center rounded text-white border-0" type="submit" value="Submit">

         </form>

<!-- the advanced form elements -->

   
    
 
</form>


   


     </div>
</body>
</html>
