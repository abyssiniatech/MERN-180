<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
        <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="m-4 p-4 border-2 rounded bg-white shadow-lg max-w-[800px] m-auto bg-gray-100 mt-10 ">
    <h1 class="bg-teal-300">Media in HTML</h1>
    <h2>Image Example</h2>
    <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8Y29kaW5nfGVufDB8fDB8fHww" alt="no image here" width="300" height="200">
    <img src="web.png" alt="Sample Image" width="300" height="200">
  <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8dGVhbXdvcmt8ZW58MHx8MHx8fDA%3D" alt="hi" width="300" height="200">
    <h2>Audio Example</h2>
    >
    <audio controls>
        <source src="sample-audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <h2>Video Example</h2>
    <video width="320" height="240" controls>
        <source src="sample-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    </div>
</body>
</html>
