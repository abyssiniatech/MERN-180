

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <div id="container" class="min-h-screen bg-gray-100 flex items-center justify-center">
    <div id="todo-app" class="bg-white p-6 rounded shadow-md w-full max-w-md">
      <h1 class="text-2xl font-bold mb-4 text-center">Todo App</h1>

      <div class="mb-4">
        <input
          id="itemInput"
          type="text"
          placeholder="Add a new task"
          class="w-full p-2 border border-gray-300 rounded"
        >
      </div>

      <button
        id="addBtn"
        class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 mb-4"
      >
        Add Task
      </button>

      <ul id="todo-list" class="list-disc pl-5 space-y-2">
        <!-- Todo items will be appended here -->
      </ul>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
