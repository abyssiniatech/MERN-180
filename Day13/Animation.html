<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <!-- tailwind animation -->
     <div class="h-screen w-full flex justify-center items-center bg-gray-200 ">
        <div class="text-blue-600 bg-teal-300 text-3xl  rounded-lg font-bold  text-white border-pink-600 p-20 ">
               <h1 class="bg-white text-indigo-600 px-6 py-3 rounded-full 
               transition duration-500 ease-in-out 
 
               hover:bg-pink-500 active:rotate-12 ">Tailwind animation </h1> 
                 <div class="border-4 border-blue-500 p-8 rounded 
            transition-colors duration-500 ease-in-out 
            hover:border-red-500 bg-pink-500 mt-8 ">
  Hover me
</div>
        <button class="bg-blue-500 mt-10 rounded-full p-4 transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-110 hover:bg-indigo-500 ...">
        Save Changes
        </button>
        <!-- button -->
         <button class="bg-pink-700 text-white duration-300 rounded-full px-4 py-2 transition duration-300 delay-150 ease-in-out hover:bg-teal-400">Add</button>
                <!-- background-in tailwind -->
<div class="bg-gradient-to-br from-cyan-200 to-pink-200 p-10 rounded-xl mt-10 text-indigo-600">
  Your content here....
</div>
        </div>
            <!-- transition -->
              
     </div>

</body>
</html>
