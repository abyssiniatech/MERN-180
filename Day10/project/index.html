<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Day 10 - To Do App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-4">📝 To-Do List</h1>
    <form class="bg-gray-50 p-4 rounded-lg " >
    <div class="flex gap-2 mb-4">
      <input 
        id="taskInput"
        type="text"
        placeholder="Enter a task..."
        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button 
        onclick="addTask()"
        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
        Add Task
      </button>
      </form>
    </div>

    <ul id="taskList" class="space-y-2">
      <!-- Tasks will appear here -->
    </ul>
        <!-- footer -->
    <footer class="mt-6 text-center text-gray-500 text-sm bg-black p-2 rounded shadow-inner">
      &copy; 2025 To-Do App. All rights reserved. By Surafel Mengist 
      </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
